name: Build cPanel

on:
  workflow_dispatch:
  push:
    branches:
      - deploy/cpanel

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Package output
        run: zip -r medicuci-output.zip .output app.js app.cjs

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: medicuci-output
          path: medicuci-output.zip